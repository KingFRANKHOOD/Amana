coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 0%
        if_ci_failed: error
    patch:
      default:
        target: 80%
        if_ci_failed: error

comment:
  layout: "reach, diff, flags, files"
  require_changes: false
  require_base: true

flags:
  frontend:
    paths:
      - frontend/
  backend:
    paths:
      - backend/
  mobile:
    paths:
      - mobile/
  contracts:
    paths:
      - contracts/