apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: amana-api-latency-alerts
  namespace: amana
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: api-performance-alerts
      rules:
        - alert: APISlowEndpointWarning
          expr: |
            histogram_quantile(0.95, sum by (le, route, method) (rate(http_request_duration_ms_bucket[5m]))) > 2000
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "API Endpoint p95 latency exceeded 2000ms threshold"
            description: >-
              Endpoint {{ $labels.method }} {{ $labels.route }} has a p95 latency
              of {{ $value | humanizeDuration }} over the last 5 minutes (threshold: 2000ms).
              Investigate database queries, upstream services, or resource constraints.

        - alert: APICriticalTailLatencyP99
          expr: |
            histogram_quantile(0.99, sum by (le, route, method) (rate(http_request_duration_ms_bucket[5m]))) > 5000
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Critical API tail latency detected (p99 > 5000ms)"
            description: >-
              Endpoint {{ $labels.method }} {{ $labels.route }} has a p99 tail latency
              of {{ $value | humanizeDuration }} over the last 5 minutes (threshold: 5000ms).
              Users are experiencing severe latency. Check connection pools and locks.

        - alert: APISlowRequestsElevatedRate
          expr: |
            sum(rate(http_slow_requests_total[5m])) > 0.05
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "High volume of slow requests (>2s)"
            description: >-
              More than 0.05 slow requests/sec (>2000ms) are occurring across the backend.
