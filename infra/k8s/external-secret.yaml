apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: amana-secrets
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: amana-vault
    kind: SecretStore
  target:
    name: amana-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: amana/application
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: amana/application
        property: POSTGRES_PASSWORD
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: amana/application
        property: REDIS_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: amana/application
        property: JWT_SECRET
    - secretKey: PINATA_API_KEY
      remoteRef:
        key: amana/application
        property: PINATA_API_KEY
    - secretKey: PINATA_SECRET
      remoteRef:
        key: amana/application
        property: PINATA_SECRET
    - secretKey: PINATA_JWT
      remoteRef:
        key: amana/application
        property: PINATA_JWT
    - secretKey: IPFS_URL_SIGNING_SECRET
      remoteRef:
        key: amana/application
        property: IPFS_URL_SIGNING_SECRET
