apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: default
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: backend
          image: kingfrankhood/amana-backend:1.0.0
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: amana-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: amana-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: amana-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-service:5432/amana"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: amana-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_URL
		      value: "redis://:$(REDIS_PASSWORD)@redis-service:6379/0"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: amana-secrets
                  key: JWT_SECRET
            - name: PINATA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: amana-secrets
                  key: PINATA_API_KEY
            - name: PINATA_SECRET
              valueFrom:
                secretKeyRef:
                  name: amana-secrets
                  key: PINATA_SECRET
            - name: PINATA_JWT
              valueFrom:
                secretKeyRef:
                  name: amana-secrets
                  key: PINATA_JWT
            - name: IPFS_URL_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: amana-secrets
                  key: IPFS_URL_SIGNING_SECRET
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
