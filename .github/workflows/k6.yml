name: Performance Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "k6/**"
      - ".github/workflows/k6.yml"
  pull_request:
    paths:
      - "k6/**"
      - ".github/workflows/k6.yml"
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    name: k6 health smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run k6 smoke test
        uses: grafana/k6-action@e4714b734f2b0afaabeb7b4a69142745548ab9ec # v0.3.1
        with:
          filename: k6/ci-smoke.js
        env:
          BASE_URL: ${{ vars.K6_BASE_URL }}