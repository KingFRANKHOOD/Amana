name: Security Audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 6:00 UTC

jobs:
  audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml
            mobile/pnpm-lock.yaml
            routes-d/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: contracts

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high --json > audit-report.json

      - name: Audit backend dependencies
        run: |
          cd backend
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high --json > audit-report.json

      - name: Audit mobile dependencies
        run: |
          cd mobile
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high --json > audit-report.json

      - name: Audit Rust dependencies
        run: cargo audit
        working-directory: contracts

      - name: Audit routes-d dependencies
        run: |
          cd routes-d
          npm ci
          npm audit --audit-level=high --json > audit-report.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-audit-report
          path: |
            frontend/audit-report.json
            backend/audit-report.json
            mobile/audit-report.json
            routes-d/audit-report.json
          retention-days: 30

  # Issue #998: full-sweep vulnerability scan across every stack.
  # No Docker images are built in this repo yet, so this scans each stack's
  # dependency tree (fs mode) rather than a built image.
  trivy-scan-all:
    name: Trivy weekly scan (${{ matrix.stack }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        stack: [frontend, backend, mobile, contracts, routes-d]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: ${{ matrix.stack }}
          format: sarif
          output: trivy-${{ matrix.stack }}.sarif
          severity: HIGH,CRITICAL

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        with:
          sarif_file: trivy-${{ matrix.stack }}.sarif
          category: trivy-weekly-${{ matrix.stack }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: high

  notify:
    name: Notify security audit failure
    if: always() && contains(needs.*.result, 'failure')
    needs:
      - audit
      - trivy-scan-all
      - dependency-review
    runs-on: ubuntu-latest
    steps:
      - name: Add failure to job summary
        run: |
          {
            echo "## Security audit failed"
            echo "- Workflow: ${{ github.workflow }}"
            echo "- Event: ${{ github.event_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Response: see docs/runbooks/security-vulnerability-response.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send Slack notification
        if: env.SECURITY_AUDIT_SLACK_WEBHOOK != ''
        env:
          SECURITY_AUDIT_SLACK_WEBHOOK: ${{ secrets.SECURITY_AUDIT_SLACK_WEBHOOK }}
        run: |
          payload=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --arg event "${{ github.event_name }}" \
            --arg sha "${{ github.sha }}" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{text: ("Security audit failed in " + $repo + " (" + $event + ") at " + $sha + ". Run: " + $url)}')
          curl --fail-with-body --silent --show-error \
            -X POST -H 'Content-Type: application/json' \
            --data "$payload" "$SECURITY_AUDIT_SLACK_WEBHOOK"
