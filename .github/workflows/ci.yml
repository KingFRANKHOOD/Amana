name: CI

permissions:
  contents: read
  pull-requests: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - '.github/workflows/ci.yml'
      - 'backend/**'
      - 'frontend/**'
      - 'mobile/**'
      - 'contracts/**'
      - 'scripts/**'
      - 'infra/**'
      - 'pnpm-lock.yaml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/ci.yml"
      - "frontend/**"
      - "backend/**"
      - "mobile/**"
      - "contracts/**"
      - "scripts/**"
      - "infra/**"

jobs:
  changes:
    name: Detect Changed Stacks
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        # Pinned from dorny/paths-filter@v3
        uses: dorny/paths-filter@6852f92c20ea7fd3b0c25de3b5112db3a98da050
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'frontend/pnpm-lock.yaml'
            backend:
              - 'backend/**'
              - 'backend/pnpm-lock.yaml'
            mobile:
              - 'mobile/**'
              - 'mobile/pnpm-lock.yaml'
            contracts:
              - 'contracts/**'
              - 'scripts/check-contract-deployment-safety.sh'
              - 'scripts/deploy-contract-local.sh'
              - 'scripts/test-deploy-contract-local.sh'

  stack:
    name: ${{ matrix.stack }} CI
    runs-on: ubuntu-latest
    needs: changes
    if: >
      (matrix.stack == 'frontend' && needs.changes.outputs.frontend == 'true') ||
      (matrix.stack == 'backend' && needs.changes.outputs.backend == 'true') ||
      (matrix.stack == 'mobile' && needs.changes.outputs.mobile == 'true') ||
      (matrix.stack == 'contracts' && needs.changes.outputs.contracts == 'true')
    strategy:
      matrix:
        stack: [frontend, backend, mobile, contracts]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: matrix.stack != 'contracts'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: matrix.stack != 'contracts'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ${{ matrix.stack == 'frontend' && 'frontend/pnpm-lock.yaml' || matrix.stack == 'backend' && 'backend/pnpm-lock.yaml' || matrix.stack == 'mobile' && 'mobile/pnpm-lock.yaml' }}

      - name: Setup Rust
        if: matrix.stack == 'contracts'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies and build
        if: matrix.stack == 'contracts'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
          cache-targets: true

      - name: Cache cargo-audit binary
        if: matrix.stack == 'contracts'
        id: cache-cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v0.21

      - name: Install cargo-audit
        if: matrix.stack == 'contracts' && steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      - name: Install deps
        if: matrix.stack != 'contracts'
        run: pnpm install --frozen-lockfile
        working-directory: ${{ matrix.stack }}

      - name: Security audit (npm)
        if: matrix.stack == 'frontend' || matrix.stack == 'backend'
        run: npm audit --audit-level=high
        working-directory: ${{ matrix.stack }}

      - name: Build
        if: matrix.stack == 'frontend' || matrix.stack == 'backend'
        run: pnpm build
        working-directory: ${{ matrix.stack }}

      - name: Lint
        if: matrix.stack == 'frontend' || matrix.stack == 'backend'
        run: pnpm lint
        working-directory: ${{ matrix.stack }}

      - name: Frontend test
        if: matrix.stack == 'frontend'
        run: pnpm test -- --coverage
        working-directory: frontend

      - name: Frontend visual regression tests
        if: matrix.stack == 'frontend'
        run: pnpm test:visual
        working-directory: frontend

      - name: Backend test
        if: matrix.stack == 'backend'
        run: |
          export NODE_ENV=test
          export JWT_SECRET=test-jwt-secret-value-with-minimum-length-32
          export TRADE_NOTES_ENCRYPTION_KEY=test-trade-notes-encryption-key-base64-32chr
          pnpm test -- --coverage
        working-directory: backend

      - name: Mobile type check
        if: matrix.stack == 'mobile'
        run: pnpm type-check
        working-directory: mobile

      - name: Mobile lint
        if: matrix.stack == 'mobile'
        run: pnpm lint
        working-directory: mobile

      - name: Mobile test
        if: matrix.stack == 'mobile'
        run: pnpm test
        working-directory: mobile

      - name: Mobile security audit
        if: matrix.stack == 'mobile'
        run: pnpm audit --audit-level=high
        working-directory: mobile

      - name: Deployment safety checks
        if: matrix.stack == 'contracts'
        run: ../../scripts/check-contract-deployment-safety.sh
        working-directory: contracts/amana_escrow

      - name: Local deployment build failure regression test
        if: matrix.stack == 'contracts'
        run: bash scripts/test-deploy-contract-local.sh

      - name: Cargo security audit
        if: matrix.stack == 'contracts'
        working-directory: contracts
        run: cargo audit

      - name: Contracts test
        if: matrix.stack == 'contracts'
        working-directory: contracts/amana_escrow
        run: cargo test --locked

      - name: Build WASM artifact
        if: matrix.stack == 'contracts'
        working-directory: contracts/amana_escrow
        run: cargo build --target wasm32-unknown-unknown --features wasm --release

      - name: Verify WASM ABI hash
        if: matrix.stack == 'contracts'
        run: |
          WASM_FILE="contracts/amana_escrow/target/wasm32-unknown-unknown/release/amana_escrow.wasm"
          if [ -f "$WASM_FILE" ]; then
            WASM_HASH=$(sha256sum "$WASM_FILE" | cut -d' ' -f1)
            echo "WASM ABI hash: $WASM_HASH"
            echo "WASM_ABI_HASH=$WASM_HASH" >> $GITHUB_ENV
          else
            echo "ERROR: WASM artifact not found at $WASM_FILE"
            exit 1
          fi

      - name: Create mobile summary artifact
        if: matrix.stack == 'mobile'
        run: |
          mkdir -p mobile/ci-artifacts
          echo "Mobile checks completed at $(date --utc)" > mobile/ci-artifacts/mobile-ci-summary.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.stack }}-artifact
          path: ${{ matrix.stack == 'frontend' && 'frontend/coverage/' || matrix.stack == 'backend' && 'backend/coverage/' || matrix.stack == 'mobile' && 'mobile/ci-artifacts/' || matrix.stack == 'contracts' && 'contracts/amana_escrow/target/wasm32-unknown-unknown/release/amana_escrow.wasm' }}
          retention-days: 7

  # Issue #998: container image vulnerability scanning. This repo does not
  # currently build/publish Docker images anywhere in CI (no Dockerfile
  # exists for backend or frontend — docker-compose.yml only references
  # third-party postgres/redis images), so there is no image to scan yet.
  # Trivy's filesystem-scan mode is the closest available equivalent today:
  # it scans each stack's dependency manifests/lockfile for known CVEs in
  # OS packages and application dependencies, which is the same class of
  # finding image scanning would otherwise catch via the base image + app
  # layer. Switch this to `scan-type: image` once real Dockerfiles and a
  # build step exist for backend/frontend.
  trivy-scan:
    name: Trivy vulnerability scan (${{ matrix.stack }})
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
      security-events: write
    if: >
      (matrix.stack == 'frontend' && needs.changes.outputs.frontend == 'true') ||
      (matrix.stack == 'backend' && needs.changes.outputs.backend == 'true')
    strategy:
      fail-fast: false
      matrix:
        stack: [frontend, backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: ${{ matrix.stack }}
          format: sarif
          output: trivy-${{ matrix.stack }}.sarif
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.stack }}.sarif
          category: trivy-${{ matrix.stack }}

  contract-tests:
    name: Frontend ↔ Backend Pact contracts
    runs-on: ubuntu-latest
    needs: changes
    if: >
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Generate consumer pacts
        run: pnpm test:pact
        working-directory: frontend

      - name: Verify backend provider
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-value-with-minimum-length-32
          TRADE_NOTES_ENCRYPTION_KEY: test-trade-notes-encryption-key-base64-32chr
        run: pnpm test:pact
        working-directory: backend

      - name: Publish pact artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amana-pacts
          path: frontend/tests/pact/pacts/*.json
          if-no-files-found: error
          retention-days: 14
