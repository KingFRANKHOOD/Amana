name: CI

permissions:
  contents: read
  pull-requests: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - '.github/workflows/ci.yml'
      - 'backend/**'
      - 'frontend/**'
      - 'mobile/**'
      - 'contracts/**'
      - 'routes-d/**'
      - 'scripts/**'
      - 'infra/**'
      - 'pnpm-lock.yaml'
  pull_request:
    branches:
      - main
      - develop

jobs:
  changes:
    name: Detect Changed Stacks
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      contracts: ${{ steps.filter.outputs.contracts }}
      routes_d: ${{ steps.filter.outputs.routes_d }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Detect changed paths
        id: filter
        # Pinned from dorny/paths-filter@v3
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'frontend/pnpm-lock.yaml'
            backend:
              - 'backend/**'
              - 'backend/pnpm-lock.yaml'
            mobile:
              - 'mobile/**'
              - 'mobile/pnpm-lock.yaml'
            contracts:
              - 'contracts/**'
              - 'scripts/check-contract-deployment-safety.sh'
            routes_d:
              - 'routes-d/**'

      - name: Check for unpinned GitHub Actions
        run: bash ./scripts/check-unpinned-actions.sh

  stack:
    name: ${{ matrix.stack }} CI
    runs-on: ubuntu-latest
    needs: changes
    if: >
      (matrix.stack == 'frontend' && needs.changes.outputs.frontend == 'true') ||
      (matrix.stack == 'backend' && needs.changes.outputs.backend == 'true') ||
      (matrix.stack == 'mobile' && needs.changes.outputs.mobile == 'true') ||
      (matrix.stack == 'contracts' && needs.changes.outputs.contracts == 'true')
    strategy:
      matrix:
        stack: [frontend, backend, mobile, contracts]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        if: matrix.stack != 'contracts'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        if: matrix.stack != 'contracts'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: pnpm
          cache-dependency-path: ${{ matrix.stack == 'frontend' && 'frontend/pnpm-lock.yaml' || matrix.stack == 'backend' && 'backend/pnpm-lock.yaml' || matrix.stack == 'mobile' && 'mobile/pnpm-lock.yaml' }}

      - name: Setup Rust
        if: matrix.stack == 'contracts'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies and build
        if: matrix.stack == 'contracts'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: contracts
          cache-targets: true

      - name: Cache cargo-audit binary
        if: matrix.stack == 'contracts'
        id: cache-cargo-audit
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v0.21

      - name: Install cargo-audit
        if: matrix.stack == 'contracts' && steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      - name: Install deps
        if: matrix.stack != 'contracts'
        run: pnpm install --frozen-lockfile
        working-directory: ${{ matrix.stack }}

      - name: Security audit (npm)
        if: matrix.stack == 'frontend' || matrix.stack == 'backend'
        run: npm audit --audit-level=high
        working-directory: ${{ matrix.stack }}

      - name: Build
        if: matrix.stack == 'frontend' || matrix.stack == 'backend'
        run: pnpm build
        working-directory: ${{ matrix.stack }}

      - name: Lint
        if: matrix.stack == 'frontend' || matrix.stack == 'backend'
        run: pnpm lint
        working-directory: ${{ matrix.stack }}

      - name: Frontend test
        if: matrix.stack == 'frontend'
        run: pnpm test -- --coverage
        working-directory: frontend

      - name: Upload frontend coverage
        if: matrix.stack == 'frontend'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend
          fail_ci_if_error: true

      - name: Frontend visual regression tests
        if: matrix.stack == 'frontend'
        run: pnpm test:visual
        working-directory: frontend

      - name: Backend test
        if: matrix.stack == 'backend'
        run: |
          export NODE_ENV=test
          export JWT_SECRET=test-jwt-secret-value-with-minimum-length-32
          export TRADE_NOTES_ENCRYPTION_KEY=test-trade-notes-encryption-key-base64-32chr
          pnpm test -- --coverage
        working-directory: backend

      - name: Upload backend coverage
        if: matrix.stack == 'backend'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage/lcov.info
          flags: backend
          name: backend
          fail_ci_if_error: true

      - name: Mobile type check
        if: matrix.stack == 'mobile'
        run: pnpm type-check
        working-directory: mobile

      - name: Mobile lint
        if: matrix.stack == 'mobile'
        run: pnpm lint
        working-directory: mobile

      - name: Mobile test
        if: matrix.stack == 'mobile'
        run: pnpm test:coverage
        working-directory: mobile

      - name: Upload mobile coverage
        if: matrix.stack == 'mobile'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: mobile/coverage/lcov.info
          flags: mobile
          name: mobile
          fail_ci_if_error: true

      - name: Mobile security audit
        if: matrix.stack == 'mobile'
        run: pnpm audit --audit-level=high
        working-directory: mobile

      - name: Deployment safety checks
        if: matrix.stack == 'contracts'
        run: ../../scripts/check-contract-deployment-safety.sh
        working-directory: contracts/amana_escrow

      - name: Cargo security audit
        if: matrix.stack == 'contracts'
        working-directory: contracts
        run: cargo audit

      - name: Contracts test
        if: matrix.stack == 'contracts'
        working-directory: contracts/amana_escrow
        run: cargo test --locked

      - name: Install cargo-llvm-cov
        if: matrix.stack == 'contracts'
        uses: taiki-e/install-action@6a241a1328ca6173d49760e1de6702cd5e52ef94 # cargo-llvm-cov

      - name: Generate contracts coverage
        if: matrix.stack == 'contracts'
        working-directory: contracts
        run: cargo llvm-cov --workspace --lcov --output-path coverage/lcov.info

      - name: Upload contracts coverage
        if: matrix.stack == 'contracts'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: contracts/coverage/lcov.info
          flags: contracts
          name: contracts
          fail_ci_if_error: true

      - name: Build WASM artifact
        if: matrix.stack == 'contracts'
        working-directory: contracts/amana_escrow
        run: cargo build --target wasm32-unknown-unknown --features wasm --release

      - name: Verify WASM ABI hash
        if: matrix.stack == 'contracts'
        run: |
          WASM_FILE="contracts/amana_escrow/target/wasm32-unknown-unknown/release/amana_escrow.wasm"
          if [ -f "$WASM_FILE" ]; then
            WASM_HASH=$(sha256sum "$WASM_FILE" | cut -d' ' -f1)
            echo "WASM ABI hash: $WASM_HASH"
            echo "WASM_ABI_HASH=$WASM_HASH" >> $GITHUB_ENV
          else
            echo "ERROR: WASM artifact not found at $WASM_FILE"
            exit 1
          fi

      - name: Create mobile summary artifact
        if: matrix.stack == 'mobile'
        run: |
          mkdir -p mobile/ci-artifacts
          echo "Mobile checks completed at $(date --utc)" > mobile/ci-artifacts/mobile-ci-summary.txt

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.stack }}-artifact
          path: ${{ matrix.stack == 'frontend' && 'frontend/coverage/' || matrix.stack == 'backend' && 'backend/coverage/' || matrix.stack == 'mobile' && 'mobile/ci-artifacts/' || matrix.stack == 'contracts' && 'contracts/amana_escrow/target/wasm32-unknown-unknown/release/amana_escrow.wasm' }}
          retention-days: 7

  routes-d:
    name: routes-d CI
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.routes_d == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: routes-d/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: routes-d

      - name: Security audit
        run: npm audit --audit-level=high
        working-directory: routes-d

      - name: Build
        run: npm run build
        working-directory: routes-d

      - name: Lint
        run: npm run lint
        working-directory: routes-d

      - name: Test with coverage
        run: npm test -- --coverage
        working-directory: routes-d

      - name: Upload routes-d coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: routes-d/coverage/lcov.info
          flags: routes-d
          name: routes-d
          fail_ci_if_error: true

      - name: Upload routes-d artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: routes-d-artifact
          path: routes-d/coverage/
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: Playwright E2E (seeded staging)
    runs-on: ubuntu-latest
    needs: changes
    if: >
      github.event_name == 'pull_request' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install application dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
        working-directory: frontend

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Create staging environment
        run: |
          cat > .env.staging <<'EOF'
          STAGING_POSTGRES_PASSWORD=staging-password
          STAGING_REDIS_PASSWORD=staging-redis-pass
          STAGING_DATABASE_URL=postgresql://postgres:staging-password@localhost:5434/amana_staging
          DATABASE_URL=postgresql://postgres:staging-password@localhost:5434/amana_staging
          REDIS_URL=redis://:staging-redis-pass@localhost:6380
          JWT_SECRET=ci-e2e-jwt-secret-value-with-minimum-length-32
          TRADE_NOTES_ENCRYPTION_KEY=ci-e2e-trade-notes-encryption-key-base64-32chr
          AMANA_ESCROW_CONTRACT_ID=ci-e2e-escrow-contract
          USDC_CONTRACT_ID=ci-e2e-usdc-contract
          CORS_ORIGINS=http://localhost:3000
          PORT=4000
          EOF

      - name: Start seeded staging stack
        run: |
          chmod +x ./scripts/staging-up.sh ./scripts/staging-validate.sh
          ./scripts/staging-up.sh --reset
          set -a
          source .env.staging
          set +a
          nohup pnpm --dir backend dev > backend-e2e.log 2>&1 &
          nohup pnpm --dir frontend dev > frontend-e2e.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:4000/health/ready >/dev/null && curl --fail --silent http://localhost:3000/ >/dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              echo "Staging services did not become ready"
              cat backend-e2e.log frontend-e2e.log
              exit 1
            fi
            sleep 2
          done

      - name: Run Playwright E2E tests
        id: e2e
        working-directory: frontend
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:4000
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/e2e-junit.xml
        run: pnpm exec playwright test tests/e2e --project=chromium-desktop --reporter=line,html,junit

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-e2e-reports
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend-e2e.log
            frontend-e2e.log
          if-no-files-found: warn
          retention-days: 14

      - name: Add E2E results to summary
        if: always()
        run: |
          {
            echo "## Playwright E2E"
            echo "- Environment: seeded staging"
            echo "- Projects: chromium-desktop"
            echo "- Result: ${{ steps.e2e.outcome }}"
            echo "- HTML report and traces: playwright-e2e-reports artifact"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tear down staging stack
        if: always()
        run: docker compose --profile staging down -v --remove-orphans

  # Issue #998: container image vulnerability scanning. This repo does not
  # currently build/publish Docker images anywhere in CI (no Dockerfile
  # exists for backend or frontend — docker-compose.yml only references
  # third-party postgres/redis images), so there is no image to scan yet.
  # Trivy's filesystem-scan mode is the closest available equivalent today:
  # it scans each stack's dependency manifests/lockfile for known CVEs in
  # OS packages and application dependencies, which is the same class of
  # finding image scanning would otherwise catch via the base image + app
  # layer. Switch this to `scan-type: image` once real Dockerfiles and a
  # build step exist for backend/frontend.
  trivy-scan:
    name: Trivy vulnerability scan (${{ matrix.stack }})
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
      security-events: write
    if: >
      (matrix.stack == 'frontend' && needs.changes.outputs.frontend == 'true') ||
      (matrix.stack == 'backend' && needs.changes.outputs.backend == 'true') ||
      (matrix.stack == 'routes-d' && needs.changes.outputs.routes_d == 'true') ||
      (matrix.stack == 'contracts' && needs.changes.outputs.contracts == 'true')
    strategy:
      fail-fast: false
      matrix:
        stack: [frontend, backend, routes-d, contracts]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: ${{ matrix.stack }}
          format: sarif
          output: trivy-${{ matrix.stack }}.sarif
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-${{ matrix.stack }}.sarif
          category: trivy-${{ matrix.stack }}

  trivy-image-scan:
    name: Trivy container image scan
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy image scan (postgres:17-alpine)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          scan-ref: postgres:17-alpine
          format: sarif
          output: trivy-postgres.sarif
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Run Trivy image scan (redis:7-alpine)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          scan-ref: redis:7-alpine
          format: sarif
          output: trivy-redis.sarif
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Upload SARIF to GitHub Security tab (postgres)
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-postgres.sarif
          category: trivy-image-postgres

      - name: Upload SARIF to GitHub Security tab (redis)
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-redis.sarif
          category: trivy-image-redis

  contract-tests:
    name: Frontend ↔ Backend Pact contracts
    runs-on: ubuntu-latest
    needs: changes
    if: >
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Generate consumer pacts
        run: pnpm test:pact
        working-directory: frontend

      - name: Verify backend provider
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-value-with-minimum-length-32
          TRADE_NOTES_ENCRYPTION_KEY: test-trade-notes-encryption-key-base64-32chr
        run: pnpm test:pact
        working-directory: backend

      - name: Publish pact artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: amana-pacts
          path: frontend/tests/pact/pacts/*.json
          if-no-files-found: error
          retention-days: 14
