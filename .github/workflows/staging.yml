name: Staging Deploy

permissions:
  contents: read
  pull-requests: read

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/staging.yml'
      - 'scripts/staging-up.sh'
      - 'scripts/staging-validate.sh'
      - 'scripts/migrate-*.sh'
      - 'backend/**'
      - 'docker-compose.yml'
      - '.env.staging.example'
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/staging.yml'
      - 'scripts/staging-up.sh'
      - 'scripts/staging-validate.sh'
      - 'scripts/migrate-*.sh'
      - 'backend/**'
      - 'docker-compose.yml'
      - '.env.staging.example'

concurrency:
  group: staging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-deploy:
    name: Deploy & Validate Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create .env.staging
        run: |
          cp .env.staging.example .env.staging
          cat >> .env.staging <<'EOF'
          STAGING_POSTGRES_PASSWORD=${{ secrets.STAGING_POSTGRES_PASSWORD }}
          STAGING_REDIS_PASSWORD=${{ secrets.STAGING_REDIS_PASSWORD }}
          STAGING_DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}
          JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}
          TRADE_NOTES_ENCRYPTION_KEY=${{ secrets.STAGING_TRADE_NOTES_ENCRYPTION_KEY }}
          EOF

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Start staging stack
        run: |
          chmod +x ./scripts/staging-up.sh ./scripts/staging-validate.sh
          ./scripts/staging-up.sh
        timeout-minutes: 10

      - name: Validate staging deployment
        run: ./scripts/staging-validate.sh
        timeout-minutes: 5

      - name: Tear down staging stack (preserve volumes on failure for debugging)
        if: always()
        run: docker compose --profile staging down --remove-orphans

      - name: Remove staging volumes (successful run only)
        if: success()
        run: docker compose --profile staging down -v --remove-orphans
