version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# Amana Docker Compose – environment-specific profiles
#
# Profiles:
#   dev      – local development (postgres + redis, persistent volume)
#   staging  – staging parity (postgres + redis, seeded synthetic data)
#   test     – CI / unit-test isolation (ephemeral in-memory postgres)
#
# Usage:
#   docker compose --profile dev     up -d
#   docker compose --profile staging up -d
#   docker compose --profile test    up -d
#
# Or use the helper scripts in scripts/:
#   ./scripts/dev-up.sh
#   ./scripts/staging-up.sh
#   ./scripts/test-up.sh
# ─────────────────────────────────────────────────────────────────────────────

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

x-redis-healthcheck: &redis-healthcheck
  test: ["CMD", "redis-cli", "ping"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 5s

# #1048 — the backend image (node:20-alpine) doesn't ship curl; wget is part
# of busybox and is present by default, so it's used here instead.
x-backend-healthcheck: &backend-healthcheck
  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

services:

  # ── Development ─────────────────────────────────────────────────────────────
  # Note: Default fallback credentials (e.g. 'password') and passwordless Redis are
  # for local isolated development only. Override passwords in non-dev environments.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password} # Dev default only
      POSTGRES_DB: ${POSTGRES_DB:-amana}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck
    deploy:
      resources:
        limits:
          memory: 512M
    profiles: [dev]

  redis:
    image: redis:7-alpine
    # Note: Unsecured Redis is dev-only. Staging/prod environments mandate authentication.
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck: *redis-healthcheck
    deploy:
      resources:
        limits:
          memory: 512M
    profiles: [dev]

  # #1048 — containerized backend for the dev profile. Local development
  # can still run `cd backend && npm run dev` directly (unaffected by this
  # service); this is for anyone who wants the whole stack — app included —
  # under `docker compose --profile dev up -d`, and for exercising the
  # healthcheck/restart behavior itself.
  backend:
    build:
      context: ./backend
      target: production
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-amana}
      REDIS_URL: redis://redis:6379/0
      # Required by backend/src/config/env.ts's zod schema -- these have no
      # schema default, so the app refuses to start without them. Values
      # come from the project-root .env (see .env.staging.example for the
      # shape); ${VAR} here is Compose's own file substitution, not a
      # passthrough of the whole .env into the container.
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-min-32-characters-long!!}
      AMANA_ESCROW_CONTRACT_ID: ${AMANA_ESCROW_CONTRACT_ID:-CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA}
      USDC_CONTRACT_ID: ${USDC_CONTRACT_ID:-CBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB}
      # Checked ad-hoc by EncryptionService, not part of the zod schema above.
      TRADE_NOTES_ENCRYPTION_KEY: ${TRADE_NOTES_ENCRYPTION_KEY:-ZGV2LW9ubHktMzItYnl0ZS1lbmNyeXB0aW9uLWtleSEh}
      # Required by a separate startup check (envValidator.js), distinct
      # from the zod schema above.
      STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
      # NODE_ENV=production (set in the image) makes the app refuse a
      # permissive/default CORS policy without this being explicit.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *backend-healthcheck
    restart: unless-stopped
    labels:
      # Picked up by the autoheal sidecar below — restart_unless_stopped
      # alone only restarts on process exit, not on a failing healthcheck
      # while the process is still running (Docker Compose has no native
      # "restart on unhealthy" trigger outside Swarm/Kubernetes).
      autoheal: "true"
    deploy:
      resources:
        limits:
          memory: 512M
    profiles: [dev]

  # #1048 — watches sibling containers' health status via the Docker socket
  # and restarts any container labeled autoheal=true once it's reported
  # "unhealthy" for AUTOHEAL_INTERVAL seconds, closing the gap noted above.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles: [dev]

  # ── Staging ─────────────────────────────────────────────────────────────────
  # Mirrors production topology: same images, separate named volume, locked
  # credentials sourced from .env.staging (never committed).
  postgres-staging:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${STAGING_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:-staging-password}
      POSTGRES_DB: ${STAGING_POSTGRES_DB:-amana_staging}
    ports:
      - "${STAGING_POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck
    deploy:
      resources:
        limits:
          memory: 512M
    profiles: [staging]

  pgbouncer-staging:
    image: pgbouncer:1.21-alpine
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/pgbouncer/pgbouncer.ini <<EOF
        [databases]
        amana_staging = host=postgres-staging port=5432 dbname=amana_staging

        [pgbouncer]
        listen_addr = 0.0.0.0
        listen_port = 6432
        auth_type = md5
        auth_file = /etc/pgbouncer/userlist.txt
        pool_mode = transaction
        max_client_conn = 100
        default_pool_size = 15
        reserve_pool_size = 5
        reserve_pool_timeout = 10
        server_idle_timeout = 600
        server_lifetime = 3600
        log_connections = 1
        log_disconnections = 1
        log_pooler_errors = 1
        stats_period = 60
        EOF
        echo "${STAGING_PGBOUNCER_USER:-postgres}:${STAGING_PGBOUNCER_PASSWORD:-staging-password}" > /etc/pgbouncer/userlist.txt
        exec pgbouncer -u pgbouncer -d /etc/pgbouncer/pgbouncer.ini
    environment:
      STAGING_PGBOUNCER_USER: ${STAGING_PGBOUNCER_USER:-postgres}
      STAGING_PGBOUNCER_PASSWORD: ${STAGING_PGBOUNCER_PASSWORD:-staging-password}
    ports:
      - "${STAGING_PGBOUNCER_PORT:-6432}:6432"
    depends_on:
      postgres-staging:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgbouncer", "-show", "stats"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    profiles: [staging]

  redis-staging:
    image: redis:7-alpine
    command: redis-server --requirepass ${STAGING_REDIS_PASSWORD:-staging-redis-pass}
    ports:
      - "${STAGING_REDIS_PORT:-6380}:6379"
    healthcheck: *redis-healthcheck
    deploy:
      resources:
        limits:
          memory: 512M
    profiles: [staging]

  loki:
    image: grafana/loki:3.0
    ports: ["3100:3100"]
    profiles: [staging]

  promtail:
    image: grafana/promtail:3.0
    volumes: ["/var/log:/var/log", "/var/lib/docker/containers:/var/lib/docker/containers"]
    profiles: [staging]

  # ── Test (CI / ephemeral) ───────────────────────────────────────────────────
  # Uses tmpfs so data never persists between test runs.
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: amana_test
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
    profiles: [test]

  redis-test:
    image: redis:7-alpine
    ports:
      - "${TEST_REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    deploy:
      resources:
        limits:
          memory: 512M
    profiles: [test]

volumes:
  postgres_data:
    driver: local
  postgres_staging_data:
    driver: local
